# Network configuration for the KIST VLA / replay publishers.
# Loaded by src/common/dds_config.py; CLI flags override these values.

dds:
  # DDS domain id (must match the gearsonic receiver; 0 = real robot,
  # any other id isolates a test bus, e.g. 42 for the vla_receiver_probe).
  domain_id: 0

  # Network interface toward the DDS peers (e.g. eno2, eth0); "lo" for
  # same-machine work. Empty ("") lets CycloneDDS pick. NOTE: multicast
  # discovery on 'lo' has failed before on this stack (2026-08-10, unitree
  # SDK interop) — if peers don't discover each other, switch to the
  # machine's default interface.
  # Applied via CYCLONEDDS_URI; an already-set CYCLONEDDS_URI env var wins.
  network_interface: "lo"
