# Network configuration for the KIST VLA / replay publishers and readers.
# Loaded by src/common/cyclonedds/config.py; CLI flags override these values.

dds:
  # DDS domain id (must match the gearsonic receiver; 0 = real robot,
  # any other id isolates a test bus, e.g. 42 for the vla_receiver_probe).
  domain_id: 0

  # CycloneDDS transport config (XML): the network interface AND the
  # socket-buffer tuning live THERE — edit config/cyclonedds.xml to change
  # the NIC. Applied via CYCLONEDDS_URI; an already-set CYCLONEDDS_URI env
  # var wins.
  cyclonedds_xml: config/cyclonedds.xml
