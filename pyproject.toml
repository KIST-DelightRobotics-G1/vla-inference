[project]
name = "kist-vla-inference"
version = "0.1.0"
description = "GR00T N1.7 VLA inference service for the KIST Unitree G1 stack. Produces SONIC motion tokens (latent protocol v4) consumed by kist-gearsonic-inference."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # ── kist_vla itself ──
    "numpy==1.26.4",
    "scipy==1.15.3",
    "pyzmq==27.0.1",
    "msgpack==1.1.0",
    "msgpack-numpy==0.4.8",
    "opencv-python-headless==4.11.0.86",
    "tyro==0.9.17",
    # ── thirdparty/gr00t (the vendored N1.7 inference path) ──
    # Pinned to the environment the checkpoints were finetuned and verified
    # in (requirements.lock.txt); torch/transformers/diffusers in particular
    # must match training. Only what the vendored files import — gr00t's own
    # pyproject additionally lists deepspeed, wandb, datasets, lmdb,
    # gymnasium, matplotlib, onnx, tensorrt, peft, accelerate, torchcodec:
    # training/eval/export tooling the inference path never touches.
    "torch==2.9.0",
    "torchvision==0.24.0",
    "transformers==4.57.3",
    "diffusers==0.35.1",
    "albumentations==1.4.18",
    "pillow==12.3.0",
    "dm-tree==0.1.10",
    "huggingface-hub==0.36.2",
]
# torch/torchvision are the cu128 builds: install with
#   uv pip install --index-strategy unsafe-best-match \
#       --extra-index-url https://download.pytorch.org/whl/cu128 -e .

[project.optional-dependencies]
dev = ["pytest"]
# cyclonedds MUST be 0.10.x: gearsonic / ext-sensor-io run CycloneDDS 0.10.2 and
# a 0.11 python reader on the domain segfaults them (XTypes discovery format;
# reproduced 2026-08-19). PyPI's default is 11.x and 0.10.2 has no cp312 wheel,
# so `pip install` compiles it from source against a local libddsc — build
# that first (README step 3) and point CYCLONEDDS_HOME at it. This line is the
# single place the version is written: the lock and the Dockerfile follow it.
dds = ["cyclonedds==0.10.2", "av"]
# The DDS state source additionally needs unitree_sdk2py (not on PyPI), pinned:
#   git clone https://github.com/unitreerobotics/unitree_sdk2_python.git ~/unitree_sdk2_python
#   git -C ~/unitree_sdk2_python checkout 65691c8a8bc53b98d3976dba4dbf9d5d20b2e7f5
#   uv pip install --no-deps -e ~/unitree_sdk2_python
# (--no-deps: it pins an old cyclonedds and pulls opencv-python; its IDL
# types work fine with current cyclonedds and opencv-python-headless.)
#
# flash-attn: optional. The checkpoint was trained with it; without it the
# backbone falls back to sdpa attention (thirdparty/gr00t/model/modules/
# qwen3_backbone.py). Prebuilt wheel for torch 2.9 / cu12 / cp312:
flash = [
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl ; python_version == '3.12' and platform_machine == 'x86_64'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kist_vla*", "thirdparty*"]

[tool.setuptools.package-data]
"thirdparty.gr00t" = ["LICENSE", "VENDORED_FROM.md", "patches/*.patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Vendored code keeps upstream's style; lint only ours.
extend-exclude = ["thirdparty"]
