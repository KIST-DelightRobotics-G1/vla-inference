[project]
name = "kist-vla-inference"
version = "0.1.0"
description = "GR00T N1.7 VLA inference service for the KIST Unitree G1 stack. Produces SONIC motion tokens (latent protocol v4) consumed by kist-gearsonic-inference."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# The replay-only dependency surface. The VLA runtime (src/vla/) needs more
# (gr00t at its pinned commit, scipy, opencv, av, unitree_sdk2py) — recover
# its install story from git history together with the docker VLA
# environment.
dependencies = [
    "numpy",
    "tyro",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
# Publishing over DDS (src/replay/publisher/). cyclonedds is PINNED to the
# robot bus's DDS generation: the 11.x wheel's modern discovery TypeObject
# segfaults the 0.10.x receivers (gearsonic, ext-sensor-io — unitree_sdk2
# vendors 0.10.2). No 0.10.x wheel exists for python 3.12 — build the
# bindings against a 0.10.2 core (the docker image does this in a builder
# stage; on a host: build the core, then
#   CYCLONEDDS_HOME=<core prefix> uv pip install --no-binary cyclonedds "kist-vla-inference[dds]").
dds = ["cyclonedds==0.10.2"]
# Replaying LeRobot training-export episodes (src/replay/io/parquet_io.py):
parquet = ["pyarrow"]
# Re-encoding recorded joints into tokens offline (src/replay/encoder/):
encode = ["onnxruntime", "pyarrow"]
# The VLA input sources (src/vla/io/): DDS camera decode + image handling.
# The unitree state source additionally needs unitree_sdk2py (not on PyPI;
# install a clone with --no-deps).
vla = ["cyclonedds==0.10.2", "av", "opencv-python-headless"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["common", "common.cyclonedds", "replay", "replay.aligner", "replay.builder", "replay.encoder", "replay.io", "replay.publisher", "vla", "vla.io", "vla.io.realsense", "vla.io.unitree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
