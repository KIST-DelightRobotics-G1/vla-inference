[project]
name = "kist-vla-inference"
version = "0.1.0"
description = "GR00T N1.7 VLA inference service for the KIST Unitree G1 stack. Produces SONIC motion tokens (latent protocol v4) consumed by kist-gearsonic-inference."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "tyro",
    "pyyaml",
]

# The `local` policy backend additionally requires the `gr00t` package
# (Isaac-GR00T, Python 3.12 only). It is not on PyPI — install from a local
# clone checked out at the commit the checkpoint was finetuned with:
#   git clone https://github.com/foodbanana/Isaac-GR00T.git ~/Isaac-GR00T
#   git -C ~/Isaac-GR00T checkout 5ac4e6b6ad7467f4ccd441f6d7ec574d4da0a21f
#   uv pip install -e ~/Isaac-GR00T
# The commit is a checkpoint coupling, not a preference — see
# src/vla/gr00t_version.py (EXPECTED_GR00T_COMMIT) and the README.
# The `remote` backend and all unit tests run without it.

[project.optional-dependencies]
dev = ["pytest"]
dds = ["cyclonedds", "av"]
# Replaying LeRobot training-export episodes (src/replay/io/parquet_io.py):
parquet = ["pyarrow"]
# Re-encoding recorded joints into tokens offline (src/replay/io/joint_encoder.py):
encode = ["onnxruntime", "pyarrow"]
# The DDS state source additionally needs unitree_sdk2py (not on PyPI):
#   uv pip install --no-deps -e ~/GR00T-WholeBodyControl/external_dependencies/unitree_sdk2_python
# (--no-deps: it pins an old cyclonedds and pulls opencv-python; its IDL
# types work fine with current cyclonedds and opencv-python-headless.)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["common", "common.cyclonedds", "replay", "replay.io", "replay.timeline", "vla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
